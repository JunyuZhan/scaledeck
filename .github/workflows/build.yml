name: Build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# ScaleDeck builds with plain Go + Node. The upstream Headscale workflows were
# driven by `nix develop`, which cannot work in a fork: nix-installer refuses
# `x86_64-darwin`, and the remaining jobs depend on upstream Cachix caches and
# secrets. Do not reintroduce Nix here.
permissions:
  contents: read

jobs:
  build-go:
    name: "Go · ${{ matrix.GOOS }}/${{ matrix.GOARCH }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { GOOS: linux, GOARCH: amd64 }
          - { GOOS: linux, GOARCH: arm64 }
          - { GOOS: darwin, GOARCH: amd64 }
          - { GOOS: darwin, GOARCH: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross compile
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.GOOS }}
          GOARCH: ${{ matrix.GOARCH }}
        run: go build -o headscale ./cmd/headscale

      - uses: actions/upload-artifact@v4
        with:
          name: headscale-${{ matrix.GOOS }}-${{ matrix.GOARCH }}
          path: headscale

  build-web:
    name: Web console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm run build` = tsc --noEmit && vite build (and restores dist/.gitkeep,
      # which vite build wipes along with the rest of dist/).
      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: hscontrol/webui/dist
