name: Deploy demo to GitHub Pages

# Builds the ScaleDeck web UI with the in-browser mock backend (VITE_DEMO=1) and
# publishes the static bundle to the `gh-pages` branch, which GitHub Pages
# serves. Runs on every push to `demo`.
on:
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: write # needed to push the built site to the gh-pages branch

concurrency:
  group: pages-demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build demo bundle
        working-directory: web
        run: VITE_DEMO=1 npm run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: hscontrol/webui/dist
          publish_branch: gh-pages
          enable_jekyll: false # ship the static SPA as-is
          force_orphan: true
